<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>Company evidence · Signalpost</title>
<style>
:root{font-family:system-ui,sans-serif;color:#132b3b;background:#f6f8fa;font-size:15px;line-height:1.5;--accent:#005a76;--muted:#536574;--line:#d8e1e8}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,label[for=file]{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #007a9e;outline-offset:3px}::selection{background:#c4e3ed}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:"Avenir Next",system-ui,sans-serif;line-height:1.2}h1{font-size:26px;margin-bottom:4px}h2{font-size:27px;margin-bottom:8px}h3{font-size:17px;margin-bottom:12px}.muted{color:var(--muted)}.small{font-size:13px}.head{padding:24px 32px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:24px}.head p{margin:0}.file-box{max-width:290px}.file-box label{display:block;font-weight:600;margin-bottom:5px}input[type=file]{font-size:12px;max-width:100%}input::file-selector-button{background:#edf3f6;border:1px solid #adbfc9;padding:6px 10px;border-radius:4px;color:#132b3b;margin-right:8px}.notice{margin:0;padding:10px 32px;background:#e8f0f4;font-size:13px;color:#314e60}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);max-width:1680px;margin:0 auto}.sidebar{padding:24px 20px 28px 28px;border-right:1px solid var(--line)}.search-label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}input[type=search]{width:100%;border:1px solid #9aafb9;background:#fff;color:inherit;border-radius:5px;padding:10px 12px;caret-color:var(--accent)}.list-status{margin:12px 0;font-size:13px;color:var(--muted)}.company-list{max-height:calc(100vh - 280px);min-height:150px;overflow-y:auto;padding:4px}.company{display:block;text-align:left;width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:12px;margin-bottom:3px;overflow-wrap:anywhere;color:inherit}.company strong{font-size:14px;font-weight:650;display:block}.company span{display:block;font-size:12px;margin-top:3px;color:var(--muted);font-variant-numeric:tabular-nums}.company[aria-pressed=true]{background:#e0edf3;border-color:#9bb9c8}.company:hover{background:#eaf1f5}.detail{padding:28px 32px 48px;min-width:0}.record-meta{display:flex;gap:10px 24px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:20px;font-variant-numeric:tabular-nums}.overview{max-width:88ch;margin-bottom:25px;line-height:1.65}.overview p{margin:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:18px 0 12px}.toolbar h3{margin:0}.toolbar label{font-size:13px}.toolbar select{background:white;color:inherit;border:1px solid #9aafb9;padding:7px;border-radius:4px;margin-left:8px}.claims{display:grid;gap:0;background:white;border:1px solid var(--line);border-radius:6px;overflow:hidden}.claim{display:grid;grid-template-columns:minmax(125px,0.65fr) minmax(140px,1fr) minmax(200px,1.2fr);gap:18px;padding:17px 18px;border-bottom:1px solid var(--line);align-items:start;font-size:14px}.claim:last-child{border:0}.claim-field{font-weight:600}.claim-family{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:4px}.claim-value{white-space:pre-wrap;overflow-wrap:anywhere}.state{font-size:12px;display:inline-block;border:1px solid #cbd8df;border-radius:4px;padding:2px 6px;margin-bottom:6px;color:#3c5563;background:#f1f5f7}.source{font-size:12px;min-width:0}.source details+details{margin-top:10px}.source summary{cursor:pointer;color:var(--accent);overflow-wrap:anywhere;list-style-position:outside;margin-left:14px}.source p{margin:5px 0}.source blockquote{margin:8px 0 0;padding:8px 10px;border-left:2px solid #adbdc6;background:#f6f8fa;overflow-wrap:anywhere}.hash{overflow-wrap:anywhere;color:var(--muted);font-family:ui-monospace,monospace;font-size:10px}.empty{padding:32px 18px;color:var(--muted);background:white;border:1px solid var(--line);border-radius:6px}.empty h2{font-size:21px}.errors{margin-top:24px;font-size:13px;overflow-wrap:anywhere}.errors ul{padding-left:20px}#message{color:#9b2929;background:#fff1f1;padding:12px 32px;margin:0}#message:empty{display:none}.footer{font-size:12px;color:var(--muted);margin-top:22px}button.clear{border:1px solid #9aafb9;border-radius:4px;background:white;color:var(--accent);padding:7px 10px}
@media(max-width:950px){.layout{grid-template-columns:250px minmax(0,1fr)}.head{padding:20px}.sidebar{padding:20px 12px}.detail{padding:24px 20px}.claim{grid-template-columns:minmax(110px,.7fr) minmax(150px,1fr)}.source{grid-column:1/-1;border-top:1px solid #edf1f4;padding-top:9px}.notice{padding:10px 20px}}
@media(max-width:620px){.head{display:block;padding:20px 16px}.file-box{margin-top:15px}.layout{display:block}.notice{padding:10px 16px}.sidebar{padding:18px 16px;border-right:0;border-bottom:1px solid var(--line)}.company-list{max-height:180px;min-height:0}.list-status{margin:8px 0}.detail{padding:23px 16px}h2{font-size:24px}.claim{display:block;padding:16px}.claim-value{margin:9px 0}.source{margin-top:10px}.toolbar{align-items:flex-start}.toolbar select{display:block;margin:3px 0 0}.record-meta{gap:6px;margin-bottom:16px}.record-meta span{display:block;width:100%}.overview{font-size:14px}.footer{line-height:1.5}}
</style>
</head>
<body>
<header class="head"><div><h1>Company evidence</h1><p class="muted small">Search Norwegian companies. Read each fact with its source.</p></div><div class="file-box"><label for="file">Open another batch</label><input id="file" type="file" accept=".jsonl,.json"><p class="small muted">The file stays in this browser.</p></div></header>
<p class="notice" id="batch-label"></p><p id="message" role="alert"></p>
<div class="layout"><aside class="sidebar" aria-label="Company selection"><label class="search-label" for="search">Company name or organisation number</label><input id="search" type="search" placeholder="Search this batch" autocomplete="off"><p class="list-status" id="list-status" role="status"></p><div class="company-list" id="companies"></div></aside><main class="detail" id="detail" aria-label="Company facts"></main></div>
<script>
"use strict";
const initial=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob("__ENVELOPES_BASE64__"),c=>c.charCodeAt(0))));
let rows=initial.envelopes,selected=null,filter="all";
const $=id=>document.getElementById(id);
function el(tag,text,className){const node=document.createElement(tag);if(text!==undefined&&text!==null)node.textContent=String(text);if(className)node.className=className;return node}
function pretty(v){return String(v||"").replaceAll("_"," ")}
function name(row){return row.claims?.find(c=>c.field==="legal_name"&&c.availability==="available")?.value||row.profile?.name||row.organisation_number}
function safeUrl(value){try{const u=new URL(value);return ["https:","http:"].includes(u.protocol)&&!u.username&&!u.password?u:null}catch{return null}}
function date(value){if(!value)return "Not recorded";const d=new Date(value);return Number.isNaN(d.valueOf())?String(value):d.toISOString().replace("T"," ").replace(/\.\d{3}Z$/," UTC")}
function valueText(v){if(v===null||v===undefined)return "Not available";if(typeof v==="object")return Object.entries(v).filter(([,value])=>value!==null).map(([key,value])=>pretty(key)+": "+(typeof value==="object"?JSON.stringify(value):String(value))).join("\n");return String(v)}
function renderList(){const query=$("search").value.toLocaleLowerCase().trim();const matches=rows.filter(r=>(String(name(r))+" "+r.organisation_number).toLocaleLowerCase().includes(query));$("list-status").textContent=`${matches.length} of ${rows.length} companies`;$("companies").replaceChildren();if(!matches.includes(selected))selected=matches[0]||null;
for(const row of matches){const b=el("button",null,"company");b.type="button";b.setAttribute("aria-pressed",String(row===selected));b.append(el("strong",name(row)),el("span",row.organisation_number));b.addEventListener("click",()=>{selected=row;for(const button of $("companies").querySelectorAll("button"))button.setAttribute("aria-pressed",String(button===b));renderDetail()});$("companies").append(b)}renderDetail()}
function sourceNode(e){const wrap=el("div");const detail=el("details");const url=safeUrl(e.source_url);detail.append(el("summary",url?url.hostname:"Source URL unavailable"));if(url){const a=el("a",e.source_url);a.href=url.href;a.target="_blank";a.rel="noopener noreferrer";detail.append(a)}if(e.source_class)detail.append(el("p",pretty(e.source_class),"muted"));if(e.claim_span)detail.append(el("blockquote",e.claim_span));detail.append(el("p",e.content_sha256?"SHA-256: "+e.content_sha256:"Content hash not recorded","hash"));wrap.append(detail,el("p","Retrieved: "+date(e.retrieved_at),"muted"));return wrap}
function renderDetail(){const out=$("detail");out.replaceChildren();if(!selected){const empty=el("section",null,"empty");empty.append(el("h2",rows.length?"No matching company":"No companies loaded"),el("p",rows.length?"Try a name or organisation number from this batch.":"Open an envelopes.jsonl or JSON list to inspect its facts."));if(rows.length){const b=el("button","Clear search","clear");b.addEventListener("click",()=>{$("search").value="";renderList();$("search").focus()});empty.append(b)}out.append(empty);return}
const row=selected;out.append(el("h2",name(row)));const meta=el("div",null,"record-meta");meta.append(el("span","Organisation no. "+row.organisation_number),el("span","Run completed: "+date(row.run?.completed_at||row.completed_at)),el("span",pretty(row.run?.terminal_status||row.state||"Status not recorded")));out.append(meta);
if(row.summary?.text){const overview=el("section",null,"overview");overview.append(el("h3","Company summary"),el("p",row.summary.text));out.append(overview)}
const claims=Array.isArray(row.claims)?row.claims:[];const toolbar=el("div",null,"toolbar");toolbar.append(el("h3",`${claims.filter(c=>c.availability==="available").length} ${claims.filter(c=>c.availability==="available").length===1?"fact":"facts"} · ${claims.filter(c=>c.availability!=="available").length} unavailable`));const label=el("label","Show");const select=el("select");select.setAttribute("aria-label","Filter facts");for(const [v,t] of [["all","All fields"],["available","Available facts"],["unavailable","Unavailable fields"]]){const option=el("option",t);option.value=v;option.selected=v===filter;select.append(option)}select.addEventListener("change",()=>{filter=select.value;renderDetail();$("detail").querySelector("select").focus()});label.append(select);toolbar.append(label);out.append(toolbar);
const evidence=new Map((row.evidence||[]).map(e=>[e.id,e]));const shown=claims.filter(c=>filter==="all"||(filter==="available"?c.availability==="available":c.availability!=="available"));const list=el("div",null,"claims");
for(const claim of shown){const item=el("article",null,"claim");const field=el("div",pretty(claim.field),"claim-field");field.append(el("span",pretty(claim.family),"claim-family"));const content=el("div",null,"claim-value");if(claim.availability!=="available")content.append(el("span",pretty(claim.availability),"state"));content.append(el("div",claim.availability==="available"?valueText(claim.value):claim.note||"No reason recorded in this batch."));if(claim.effective_at)content.append(el("p","Effective date: "+claim.effective_at,"small muted"));if(claim.reporting_period)content.append(el("p",`Reporting period: ${claim.reporting_period.start||"unknown"} to ${claim.reporting_period.end||"unknown"}`,"small muted"));const source=el("div",null,"source");let found=0;for(const id of claim.evidence_ids||[]){const e=evidence.get(id);if(e){source.append(sourceNode(e));found++}}if(!found)source.append(el("p","Source and retrieval date not recorded","muted"));item.append(field,content,source);list.append(item)}if(!shown.length)list.append(el("p","No fields in this view.","empty"));out.append(list);
if(row.errors?.length){const box=el("details",null,"errors");box.append(el("summary",`${row.errors.length} run issues`));const ul=el("ul");for(const error of row.errors)ul.append(el("li",`${error.stage||"Run"}: ${error.error||valueText(error)}`));box.append(ul);out.append(box)}out.append(el("p","Missing values are not zero. A source retrieval date is not the date an event happened. Open a source to inspect the supporting text and content hash.","footer"))}
$("batch-label").textContent=initial.label;$("search").addEventListener("input",renderList);
$("file").addEventListener("change",async event=>{const file=event.target.files[0];if(!file)return;$("message").textContent="";try{if(file.size>100*1024*1024)throw Error("Choose a file smaller than 100 MB.");const text=(await file.text()).replace(/^\uFEFF/,"");const data=text.trim().startsWith("[")?JSON.parse(text):text.split(/\r?\n/).filter(l=>l.trim()).map(l=>JSON.parse(l));if(!Array.isArray(data)||data.some(r=>!r||typeof r!=="object"||!r.organisation_number||!Array.isArray(r.claims)||r.claims.some(c=>!c||typeof c!=="object"||typeof c.field!=="string"||!Array.isArray(c.evidence_ids))||!Array.isArray(r.evidence)||r.evidence.some(e=>!e||typeof e!=="object"||typeof e.id!=="string")))throw Error("Expected batch envelopes with organisation_number and claims.");rows=data;selected=null;filter="all";$("search").value="";$("batch-label").textContent=file.name;renderList()}catch(error){$("message").textContent="Could not open this batch. "+error.message}finally{event.target.value=""}});
renderList();
</script>
</body>
</html>
